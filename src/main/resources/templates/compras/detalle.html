<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout/plantilla :: head}"></head>
    <body class="d-flex">
        <div th:replace="~{layout/plantilla :: sidebar('compras')}"></div>

        <div class="main-content">
            <header th:replace="~{layout/plantilla :: topbar('Compras a Proveedores')}"></header>

            <main class="p-4">

                <div th:if="${exito}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${exito}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="card border-0 shadow-sm rounded-3 p-4" style="max-width: 900px;">

                    <h4 class="fw-bold mb-3">Compra N.° <span th:text="${compra.id}"></span></h4>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <p class="mb-1"><strong>Fecha:</strong>
                                <span th:text="${#temporals.format(compra.fecha, 'dd/MM/yyyy HH:mm')}"></span>
                            </p>
                            <p class="mb-1"><strong>Proveedor:</strong>
                                <span th:text="${compra.proveedor.nombre}"></span>
                            </p>
                        </div>
                        <div class="col-md-6">
                            <p class="mb-1"><strong>Teléfono:</strong>
                                <span th:text="${compra.proveedor.telefono}"></span>
                            </p>
                            <p class="mb-1"><strong>Correo:</strong>
                                <span th:text="${compra.proveedor.correo}"></span>
                            </p>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table align-middle text-secondary">
                            <thead>
                                <tr class="text-muted small">
                                    <th>Producto</th>
                                    <th>Cantidad recibida</th>
                                    <th>Costo unitario</th>
                                    <th>Subtotal</th>
                                    <th>Existencias actuales</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="d : ${compra.detalles}">
                                    <td class="text-dark fw-semibold" th:text="${d.accesorio.descripcion}"></td>
                                    <td th:text="${d.cantidad}"></td>
                                    <td th:text="${'₡' + d.costoUnitario}"></td>
                                    <td th:text="${'₡' + d.subtotal}"></td>
                                    <td th:text="${d.accesorio.cantidad}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <h5 class="text-end mt-3">
                        Total de la compra: <span th:text="${'₡' + compra.total}"></span>
                    </h5>

                    <div class="mt-3">
                        <a th:href="@{/compras}" class="btn btn-outline-secondary btn-sm">Volver a compras</a>
                    </div>
                </div>
            </main>
        </div>

        <script th:replace="~{layout/plantilla :: scripts}"></script>
    </body>
</html>
