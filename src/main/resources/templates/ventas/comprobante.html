
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/plantilla :: head}"></head>

<body class="p-4">

<div class="container" style="max-width: 800px;">

    <div class="card p-4 shadow-sm">

        <h2 class="fw-bold">CyclePro</h2>

        <h4>Comprobante de venta</h4>

        <hr>

        <p>
            <strong>Número de venta:</strong>
            <span th:text="${venta.id}"></span>
        </p>

        <p>
            <strong>Fecha:</strong>
            <span th:text="${#temporals.format(
                venta.fecha,
                'dd/MM/yyyy HH:mm')}">
            </span>
        </p>

        <p>
            <strong>Cliente:</strong>
            <span th:text="${venta.cliente.nombre}">
            </span>
        </p>

        <p>
            <strong>Identificación:</strong>
            <span th:text="${venta.cliente.identificacion}">
            </span>
        </p>

        <hr>

        <h5>Detalle de productos</h5>

        <table class="table table-bordered">

            <thead class="table-light">
                <tr>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Precio unitario</th>
                    <th>Subtotal</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="d : ${venta.detalles}">

                    <td th:text="${d.descripcion}"></td>

                    <td th:text="${d.cantidad}"></td>

                    <td th:text="${'₡' + d.precioUnitario}">
                    </td>

                    <td th:text="${'₡' + d.subtotal}">
                    </td>

                </tr>

            </tbody>

        </table>

        <h4 class="text-end mt-4">
            Total:
            <span th:text="${'₡' + venta.total}"></span>
        </h4>

        <hr>

        <p class="text-muted small">
            Comprobante interno de venta.
            No sustituye una factura electrónica.
        </p>

        <div class="d-print-none">

            <button class="btn btn-primary"
                    onclick="window.print()">
                Imprimir comprobante
            </button>

            <a th:href="@{/ventas}"
               class="btn btn-outline-secondary">
                Volver a ventas
            </a>

        </div>

    </div>

</div>

</body>
</html>
