
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">

    <meta charset="UTF-8"/>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0"/>

    <title>
        CyclePro - Sistema de Gestión de Bicicletas y Taller
    </title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"/>

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

    <style>

        body {
            background-color: #f8fafc;
            font-family: system-ui, -apple-system,
                         "Segoe UI", Roboto, sans-serif;
        }

        .sidebar {
            background-color: #0b1523;
            min-height: 100vh;
            width: 250px;
            color: #94a3b8;
            flex-shrink: 0;
        }

        .sidebar .nav-link {
            color: #94a3b8;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 4px;
        }

        .sidebar .nav-link:hover {
            color: #fff;
            background-color: #162438;
        }

        .sidebar .nav-link.active {
            background-color: #2563eb;
            color: #fff;
        }

        .main-content {
            flex-grow: 1;
            min-width: 0;
        }

        .badge-completada {
            background-color: #ecfdf5;
            color: #059669;
            border: 1px solid #a7f3d0;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 500;
        }

        .card-kpi {
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .avatar-user {
            width: 32px;
            height: 32px;
            background-color: #2563eb;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .table thead {
            background-color: #f8fafc;
        }

        .table th {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .table td {
            font-size: 0.9rem;
        }

        .btn-primary {
            background-color: #2563eb;
            border-color: #2563eb;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
            border-color: #1d4ed8;
        }

    </style>

</head>

<body>

    <!-- MENÚ LATERAL -->
    <div th:fragment="sidebar(activeTab)"
         class="sidebar d-flex flex-column p-3">

        <!-- LOGOTIPO -->
        <div class="d-flex align-items-center
                    gap-2 px-2 py-3 mb-3">

            <i class="fa-solid fa-bicycle
                      text-primary fs-3"></i>

            <div>

                <h5 class="text-white mb-0 fw-bold">
                    CyclePro
                </h5>

                <small style="font-size: 0.75rem;">
                    Tu ciclo, nuestra pasión
                </small>

            </div>
        </div>

        <!-- OPCIONES -->
        <ul class="nav flex-column mb-auto">

            <!-- INICIO -->
            <li class="nav-item">

                <a th:href="@{/}"
                   class="nav-link"
                   th:classappend="${activeTab == 'inicio'} ? 'active' : ''">

                    <i class="fa-solid fa-house"></i>
                    Inicio
                </a>
            </li>

            <!-- CLIENTES -->
            <li class="nav-item">

                <a th:href="@{/cliente/listado}"
                   class="nav-link"
                   th:classappend="${activeTab == 'clientes'} ? 'active' : ''">

                    <i class="fa-solid fa-users"></i>
                    Clientes
                </a>
            </li>

            <!-- INVENTARIO HU-04 -->
            <li class="nav-item">

                <a th:href="@{/inventario/listado}"
                   class="nav-link"
                   th:classappend="${activeTab == 'inventario'} ? 'active' : ''">

                    <i class="fa-solid fa-box-archive"></i>
                    Inventario
                </a>
            </li>

            <!-- VENTAS HU-05 -->
            <li class="nav-item">

                <a th:href="@{/ventas}"
                   class="nav-link"
                   th:classappend="${activeTab == 'ventas'} ? 'active' : ''">

                    <i class="fa-solid fa-cart-shopping"></i>
                    Ventas
                </a>
            </li>

            <!-- TALLER -->
            <li class="nav-item">

                <a href="#" class="nav-link">

                    <i class="fa-solid fa-screwdriver-wrench"></i>
                    Taller
                </a>
            </li>

            <!-- SERVICIOS -->
            <li class="nav-item">

                <a href="#" class="nav-link">

                    <i class="fa-solid fa-wrench"></i>
                    Servicios
                </a>
            </li>

                       <!-- COMPRAS HU-08 -->
            <li class="nav-item">

                <a th:href="@{/compras}"
                   class="nav-link"
                   th:classappend="${activeTab == 'compras'} ? 'active' : ''">

                    <i class="fa-solid fa-truck"></i>
                    Compras
                </a>
            </li>

                        <!-- PROVEEDORES HU-07 -->
            <li class="nav-item">

                <a th:href="@{/proveedor/listado}"
                   class="nav-link"
                   th:classappend="${activeTab == 'proveedores'} ? 'active' : ''">

                    <i class="fa-solid fa-handshake"></i>
                    Proveedores
                </a>
            </li>

            <!-- REPORTES -->
            <li class="nav-item">

                <a href="#" class="nav-link">

                    <i class="fa-solid fa-chart-column"></i>
                    Reportes
                </a>
            </li>

            <!-- CONFIGURACIÓN -->
            <li class="nav-item">

                <a href="#" class="nav-link">

                    <i class="fa-solid fa-gear"></i>
                    Configuración
                </a>
            </li>

        </ul>

        <!-- USUARIO -->
        <div class="pt-3 border-top border-secondary
                    border-opacity-25
                    d-flex align-items-center gap-2">

            <div class="avatar-user">
                A
            </div>

            <div class="flex-grow-1 overflow-hidden">

                <p class="text-white small mb-0
                          fw-bold text-truncate">
                    Administrador
                </p>

                <small class="text-muted d-block
                              text-truncate"
                       style="font-size: 0.75rem;">
                    admin@cyclepro.cr
                </small>

            </div>

            <a href="#" class="text-secondary">

                <i class="fa-solid
                          fa-arrow-right-from-bracket"></i>

            </a>

        </div>

    </div>

    <!-- ENCABEZADO SUPERIOR -->
    <header th:fragment="topbar(seccion)"
            class="bg-white border-bottom py-2 px-4
                   d-flex justify-content-between
                   align-items-center">

        <span class="text-secondary small fw-medium"
              th:text="${seccion}">
            Panel principal
        </span>

        <div class="d-flex align-items-center gap-3">

            <i class="fa-regular fa-bell text-secondary"></i>

            <div class="d-flex align-items-center gap-2">

                <div class="avatar-user">
                    A
                </div>

                <span class="small fw-semibold">
                    Administrador
                </span>

            </div>

        </div>

    </header>

    <!-- SCRIPTS DE BOOTSTRAP -->
    <script th:fragment="scripts"
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
